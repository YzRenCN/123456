// ========== 安全生成图标（DOM方式，彻底避免转义错误） ==========
function buildIcon(site) {
    var dom = site.u.split('/')[0];
    var img = document.createElement('img');
    img.className = 'site-icon';
    img.alt = site.n;
    img.width = 26;
    img.height = 26;
    img.src = 'https://www.google.com/s2/favicons?domain=' + dom + '&sz=64';
    
    var stage = 0; // 0=primary, 1=backup, 2=fallback
    img.addEventListener('error', function handleErr() {
        if (stage === 0) {
            stage = 1;
            img.src = 'https://api.iowen.cn/favicon/' + dom + '.png';
        } else if (stage === 1) {
            stage = 2;
            // 替换为色块占位
            var fb = document.createElement('div');
            fb.className = 'site-icon-fb';
            fb.style.background = site.c;
            fb.textContent = site.t;
            img.parentNode.replaceChild(fb, img);
        }
    });
    return img;
}

// ========== 渲染所有站点 ==========
function renderAll() {
    Object.keys(SITES).forEach(function(cat) {
        var panel = document.getElementById('panel-' + cat);
        if (!panel) return;
        panel.innerHTML = '';
        SITES[cat].forEach(function(site) {
            var fullUrl = site.u.indexOf('http') === 0 ? site.u : 'https://' + site.u;
            var a = document.createElement('a');
            a.href = fullUrl;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'site-card';
            a.setAttribute('draggable', 'false');
            a.title = site.n;
            a.setAttribute('data-name', site.n);
            a.appendChild(buildIcon(site));
            var sp = document.createElement('span');
            sp.className = 'site-name';
            sp.textContent = site.n;
            a.appendChild(sp);
            panel.appendChild(a);
        });
        var nr = document.createElement('div');
        nr.className = 'no-result';
        nr.id = 'noResult-' + cat;
        nr.textContent = '未找到匹配网站';
        panel.appendChild(nr);
    });
}
renderAll();

    var s = (n.getMonth()+1) + '月' + n.getDate() + '日 星期' + d[n.getDay()] + ' ' + ('0'+n.getHours()).slice(-2) + ':' + ('0'+n.getMinutes()).slice(-2);
    var el = document.getElementById('timeNow');
    if (el) el.textContent = s;
}

// ========== 过滤搜索 ==========
var fi = document.getElementById('filterInput');
var fc = document.getElementById('filterClear');
var fs = document.getElementById('filterStats');
var fq = '';

fs.textContent = '共收录 ' + TOTAL + ' 个网站';

function applyFilter() {
    var q = fq.trim().toLowerCase();
    var p = document.getElementById('panel-' + curCat);
    if (!p) return;
    var cards = p.querySelectorAll('.site-card');
    var vis = 0;
    var nr = document.getElementById('noResult-' + curCat);
    for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        var n = (card.getAttribute('data-name') || '').toLowerCase();
        var h = (card.getAttribute('href') || '').toLowerCase();
        var ne = card.querySelector('.site-name');
        var orig = card.getAttribute('data-name') || (ne ? ne.textContent : '');
        if (!q || n.indexOf(q) >= 0 || h.indexOf(q) >= 0) {
            card.classList.remove('hidden-by-filter');
            if (ne) {
                if (q && n.indexOf(q) >= 0) {
                    var idx = n.indexOf(q);
                    ne.textContent = '';
                    ne.appendChild(document.createTextNode(orig.substring(0, idx)));
                    var mk = document.createElement('mark');
                    mk.style.background = '#fef3c7';
                    mk.style.color = '#92400e';
                    mk.style.padding = '1px 4px';
                    mk.style.borderRadius = '3px';
                    mk.textContent = orig.substring(idx, idx + q.length);
                    ne.appendChild(mk);
                    ne.appendChild(document.createTextNode(orig.substring(idx + q.length)));
                } else {
                    ne.textContent = orig;
                }
            }
            vis++;
        } else {
            card.classList.add('hidden-by-filter');
            if (ne) ne.textContent = orig;
        }
    }
    if (q) {
        fs.innerHTML = '找到 <strong>' + vis + '</strong> 个匹配';
        fc.classList.add('show');
        if (nr) {
            if (vis === 0) nr.classList.add('show');
            else nr.classList.remove('show');
        }
    } else {
        fs.textContent = '共收录 ' + TOTAL + ' 个网站';
        fc.classList.remove('show');
        if (nr) nr.classList.remove('show');
    }
}

fi.addEventListener('input', function() {
    fq = this.value;
    applyFilter();
});
fi.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        var p = document.getElementById('panel-' + curCat);
        if (p) {
            var f = p.querySelector('.site-card:not(.hidden-by-filter)');
            if (f) window.open(f.href, '_blank');
        }
    }
    if (e.key === 'Escape') {
        fi.value = '';
        fq = '';
        applyFilter();
    }
});
fc.addEventListener('click', function() {
    fi.value = '';
    fq = '';
    applyFilter();
    fi.focus();
});

// ========== 拖拽排序 ==========
var dragOn = false, dragEl = null;
var dt = document.getElementById('dragToggle');
dt.addEventListener('click', function() {
    dragOn = !dragOn;
    dt.classList.toggle('on', dragOn);
    dt.textContent = dragOn ? '✓ 拖拽中' : '拖拽排序';
    var all = document.querySelectorAll('.site-card');
    for (var i = 0; i < all.length; i++) {
        all[i].setAttribute('draggable', dragOn ? 'true' : 'false');
        all[i].style.cursor = dragOn ? 'grab' : 'pointer';
    }
});

var ca = document.getElementById('contentArea');
ca.addEventListener('dragstart', function(e) {
    if (!dragOn) return;
    var c = e.target.closest ? e.target.closest('.site-card') : null;
    if (!c) return;
    dragEl = c;
    c.classList.add('dragging');
    if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', c.getAttribute('data-name')); } catch(x) {}
    }
});
ca.addEventListener('dragend', function(e) {
    var c = e.target.closest ? e.target.closest('.site-card') : null;
    if (c) c.classList.remove('dragging');
    var overs = ca.querySelectorAll('.site-card.drag-over');
    for (var i = 0; i < overs.length; i++) overs[i].classList.remove('drag-over');
    dragEl = null;
});
ca.addEventListener('dragover', function(e) {
    if (!dragOn || !dragEl) return;
    e.preventDefault();
    var c = e.target.closest ? e.target.closest('.site-card') : null;
    if (!c || c === dragEl) return;
    if (c.parentElement !== dragEl.parentElement) return;
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    var overs = ca.querySelectorAll('.site-card.drag-over');
    for (var i = 0; i < overs.length; i++) overs[i].classList.remove('drag-over');
    c.classList.add('drag-over');
});
ca.addEventListener('dragleave', function(e) {
    var c = e.target.closest ? e.target.closest('.site-card') : null;
    if (c) c.classList.remove('drag-over');
});
ca.addEventListener('drop', function(e) {
    if (!dragOn || !dragEl) return;
    e.preventDefault();
    var c = e.target.closest ? e.target.closest('.site-card') : null;
    if (!c || c === dragEl || c.parentElement !== dragEl.parentElement) return;
    c.classList.remove('drag-over');
    var r = c.getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) c.parentElement.insertBefore(dragEl, c);
    else c.parentElement.insertBefore(dragEl, c.nextSibling);
    saveOrder();
});

function saveOrder() {
    var o = {};
    var panels = document.querySelectorAll('.cat-panel');
    for (var i = 0; i < panels.length; i++) {
        var p = panels[i];
        var key = p.getAttribute('data-cat');
        var cards = p.querySelectorAll('.site-card');
        var arr = [];
        for (var j = 0; j < cards.length; j++) arr.push(cards[j].getAttribute('data-name'));
        o[key] = arr;
    }
    try { localStorage.setItem('nav_order', JSON.stringify(o)); } catch(x) {}
}

function loadOrder() {
    try {
        var s = localStorage.getItem('nav_order');
        if (!s) return;
        var o = JSON.parse(s);
        var keys = Object.keys(o);
        for (var i = 0; i < keys.length; i++) {
            var k = keys[i];
            var p = document.getElementById('panel-' + k);
            if (!p) continue;
            var m = {};
            var cards = p.querySelectorAll('.site-card');
            for (var j = 0; j < cards.length; j++) m[cards[j].getAttribute('data-name')] = cards[j];
            var nr = p.querySelector('.no-result');
            var names = o[k];
            for (var j = 0; j < names.length; j++) {
                if (m[names[j]]) p.insertBefore(m[names[j]], nr);
            }
        }
    } catch(x) {}
}
loadOrder();

        e.preventDefault();
        fi.focus();
    }
});
